name: ci-cd

# Trigger: every push and every pull request. Images are only pushed from main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Gate 1: fast feedback (unit + contract tests) - the base of the test pyramid
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: npm ci
      - name: Lint (syntax check)
        working-directory: services/${{ matrix.service }}
        run: npm run lint
      - name: Unit tests
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

  contract:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Contract tests (Order -> Inventory)
        run: node --test "contract-tests/*.test.js"

  # Gate 2: BUILD ONCE. Each image is built a single time, tagged with the commit SHA,
  # and the identical artefact is what gets tested, staged and promoted to production.
  build:
    runs-on: ubuntu-latest
    needs: [test, contract]
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maltashop" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed on pull requests)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/${{ matrix.service }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}.tar

  # Gate 3: integration smoke test with the real broker, using the images built above.
  integration:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maltashop" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp/images
          merge-multiple: true
      - name: Load the exact images that were built
        run: for f in /tmp/images/*.tar; do docker load -i "$f"; done
      - name: Start the system from the pre-built images (no rebuild)
        env:
          TAG: ${{ github.sha }}
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            curl -sf localhost:3001/ready && break; sleep 3
          done
      - name: End-to-end happy path and compensation path
        run: bash scripts/smoke-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  # Gate 4: publish. Only from main. Promotion = re-tag the SAME image, never rebuild.
  publish:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - name: Compute lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/maltashop" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image tagged with the commit SHA
        run: |
          docker load -i /tmp/${{ matrix.service }}.tar
          docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
      # Deployment to staging/production (Kubernetes, canary for payment) is described in the
      # report; it would consume these SHA-tagged images and is intentionally out of scope here.
